# ==============================================================================
# ROAD RESQ AI 2.0 – Production Multi-Container Compose Stack
# Red Hat DO188 Capstone & Enterprise Podman Deployment
# Usage: podman compose up -d --build (or docker compose up -d --build)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Main Application Service (React Frontend + Express Engine + WebSockets)
  # ----------------------------------------------------------------------------
  roadresq-app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: roadresq-app
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_PORT=5173
      - MONGODB_URI=mongodb://roadresq-mongodb:27017/roadresq
      - REDIS_URL=redis://roadresq-redis:6379
      - DEFAULT_CITY_ID=chennai
      - OSRM_BASE_URL=https://router.project-osrm.org
    depends_on:
      roadresq-mongodb:
        condition: service_healthy
      roadresq-redis:
        condition: service_healthy
    networks:
      - roadresq-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. Persistent Database Service (MongoDB with Named Volume)
  # ----------------------------------------------------------------------------
  roadresq-mongodb:
    image: docker.io/library/mongo:7.0
    container_name: roadresq-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - roadresq-mongo-data:/data/db:Z
    networks:
      - roadresq-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Cache & Background Job Broker (Redis)
  # ----------------------------------------------------------------------------
  roadresq-redis:
    image: docker.io/library/redis:7-alpine
    container_name: roadresq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - roadresq-redis-data:/data:Z
    networks:
      - roadresq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  roadresq-net:
    driver: bridge
    name: roadresq-net

volumes:
  roadresq-mongo-data:
    name: roadresq-mongo-data
  roadresq-redis-data:
    name: roadresq-redis-data
